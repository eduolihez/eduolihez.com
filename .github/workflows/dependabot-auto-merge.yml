name: "Dependabot auto-merge"

# POR QUE EXISTE: los PRs de Dependabot (js-yaml, astro, actions/checkout...)
# se quedaron abiertos semanas sin que nadie los revisara, incluyendo dos
# vulnerabilidades HIGH activas mientras tanto. Un bump menor/parche que ya
# pasa la suite de tests no necesita ojos humanos; uno mayor (puede romper
# cosas) sigue esperando revision manual.

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Leer metadatos del PR de Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Menor/parche (npm) y cualquier bump de GitHub Actions: se agrupan en
      # dependabot.yml precisamente porque casi nunca rompen nada. Un "major"
      # de npm (ej. Astro 7 -> 8) se queda fuera para revision manual.
      # EXCEPCION /e2e (@playwright/test): el unico check obligatorio es
      # "Vitest", y los tests E2E (admin.yml) NO lo son. Auto-fusionar un bump
      # de Playwright porque Vitest esta en verde no probaria nada sobre
      # Playwright, asi que esos PRs esperan revision manual. Se detecta de dos
      # formas por robustez: el output `directory` de fetch-metadata y el
      # nombre de la rama (Dependabot incluye el directorio en las ramas de
      # los directorios no raiz: dependabot/npm_and_yarn/e2e/...).
      - name: Auto-aprobar y activar auto-merge (squash)
        if: |
          (
            steps.metadata.outputs.update-type != 'version-update:semver-major' ||
            steps.metadata.outputs.package-ecosystem == 'github_actions'
          ) &&
          !startsWith(steps.metadata.outputs.directory, '/e2e') &&
          !contains(github.head_ref, '/e2e/')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
