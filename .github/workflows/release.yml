name: "Release"

# POR QUE EXISTE: cada version real (VERSION + entrada en CHANGELOG.md) queda
# como una Release en GitHub con dist/ + server/ ya listos, en un solo zip.
# Asi quien necesite desplegar a mano descarga el zip, lo descomprime y sube
# ambas carpetas por FTP de una vez (ver "Despliegue en servidor" en el
# README: dist/ -> public_html/, server/ al mismo nivel), sin tener que
# clonar el repo ni compilar nada localmente. Se dispara con un tag de
# version (a mano, o automaticamente en cada push a master via
# auto-version.yml), no con cada commit suelto, para no llenar la pestana
# Releases con un release por cada arreglo pequeno.
#
# COMO SE ETIQUETA: el tag debe coincidir EXACTO con el contenido de
# VERSION, con "v" delante (VERSION="1.1.0.0" -> tag "v1.1.0.0").
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Compilar el sitio (astro build)
        run: npm run build

      - name: Verificar que el tag coincide con VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::El tag v$TAG no coincide con VERSION ($FILE_VERSION)"
            exit 1
          fi

      - name: Empaquetar dist/ + server/
        run: |
          # dist/ y server/ quedan como carpetas de nivel superior dentro del
          # zip (no fusionadas), para que al descomprimir se puedan arrastrar
          # las dos directamente al hosting, igual que describe el README.
          # server/config.php nunca esta aqui (esta en .gitignore), asi que
          # no hay credenciales en el zip.
          zip -r "eduolihez.com-${{ github.ref_name }}.zip" dist server

      - name: Extraer la seccion del CHANGELOG para este tag
        id: changelog
        run: |
          VERSION_HEADER="## [${GITHUB_REF_NAME#v}]"
          awk -v header="$VERSION_HEADER" '
            index($0, header) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_Sin entrada en CHANGELOG.md para ${{ github.ref_name }}._" > release-notes.md
          fi

      - name: Crear la Release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}"
          body_path: release-notes.md
          files: "eduolihez.com-${{ github.ref_name }}.zip"
          fail_on_unmatched_files: true
