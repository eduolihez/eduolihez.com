name: "Tests"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions: {}

# Igual que en codeql.yml: evita ejecuciones solapadas sobre la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Compilar el sitio (astro build)
        run: npm run build
